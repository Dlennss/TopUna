name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            BACKEND_DIR="${{ secrets.BACKEND_SOURCE_DIR }}"
            FRONTEND_DIR="${{ secrets.FRONTEND_SOURCE_DIR }}"
            BACKEND_REPO="$(dirname "$BACKEND_DIR")"
            FRONTEND_REPO="$(dirname "$FRONTEND_DIR")"

            git config --global --add safe.directory "$BACKEND_DIR"
            git config --global --add safe.directory "$FRONTEND_DIR"
            git config --global --add safe.directory "$BACKEND_REPO"
            git config --global --add safe.directory "$FRONTEND_REPO"

            cd "$BACKEND_DIR"
            git fetch origin "${{ inputs.ref }}"
            git checkout "${{ inputs.ref }}"
            git pull --ff-only origin "${{ inputs.ref }}"
            go mod download
            go test ./...
            go build -o pulsa2 .

            cd "$FRONTEND_DIR"
            git fetch origin "${{ inputs.ref }}"
            git checkout "${{ inputs.ref }}"
            git pull --ff-only origin "${{ inputs.ref }}"
            npm ci
            npm run build

            if [ -n "${{ secrets.FRONTEND_RELEASE_DIR }}" ] && [ "${{ secrets.FRONTEND_RELEASE_DIR }}" != "$FRONTEND_DIR" ]; then
              mkdir -p "${{ secrets.FRONTEND_RELEASE_DIR }}"
              rsync -a --delete \
                --exclude ".git" \
                --exclude "node_modules" \
                --exclude ".env.local" \
                "$FRONTEND_DIR/" \
                "${{ secrets.FRONTEND_RELEASE_DIR }}/"

              cd "${{ secrets.FRONTEND_RELEASE_DIR }}"
              npm ci --omit=dev
            fi

            if command -v pm2 >/dev/null 2>&1; then
              if [ -n "${{ secrets.PM2_BACKEND_APP_NAME }}" ]; then
                pm2 restart "${{ secrets.PM2_BACKEND_APP_NAME }}" --update-env
              fi
              if [ -n "${{ secrets.PM2_FRONTEND_APP_NAME }}" ]; then
                pm2 restart "${{ secrets.PM2_FRONTEND_APP_NAME }}" --update-env
              fi
              pm2 save
            else
              echo "pm2 not found. Build completed, restart the app manually."
            fi
