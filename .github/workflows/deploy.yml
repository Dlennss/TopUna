name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            DEPLOY_REF="${{ github.ref_name }}"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.ref }}" ]; then
              DEPLOY_REF="${{ inputs.ref }}"
            fi

            BACKEND_DIR="${{ secrets.BACKEND_SOURCE_DIR }}"
            FRONTEND_DIR="${{ secrets.FRONTEND_SOURCE_DIR }}"
            BACKEND_REPO="$(dirname "$BACKEND_DIR")"
            FRONTEND_REPO="$(dirname "$FRONTEND_DIR")"

            export GIT_CONFIG_GLOBAL="/tmp/topuna-gitconfig-$(id -u)-$$"
            touch "$GIT_CONFIG_GLOBAL"
            git config --global --add safe.directory "$BACKEND_DIR"
            git config --global --add safe.directory "$FRONTEND_DIR"
            git config --global --add safe.directory "$BACKEND_REPO"
            git config --global --add safe.directory "$FRONTEND_REPO"

            cd "$BACKEND_DIR"
            git fetch origin "$DEPLOY_REF"
            git checkout "$DEPLOY_REF"
            git pull --ff-only origin "$DEPLOY_REF"
            echo "Backend deployed commit: $(git rev-parse --short HEAD)"
            go mod download
            go test ./...
            go build -o pulsa2 .

            cd "$FRONTEND_DIR"
            git fetch origin "$DEPLOY_REF"
            git checkout "$DEPLOY_REF"
            git pull --ff-only origin "$DEPLOY_REF"
            echo "Frontend deployed commit: $(git rev-parse --short HEAD)"
            test -f package.json
            test -f components/site/TopunaReferenceHome.tsx
            test -f public/topuna-assets/Topuna_Assets_Pecah/09_section_blocks/top_header_stack.png
            npm ci
            npm run build

            if [ -n "${{ secrets.FRONTEND_RELEASE_DIR }}" ] && [ "${{ secrets.FRONTEND_RELEASE_DIR }}" != "$FRONTEND_DIR" ]; then
              mkdir -p "${{ secrets.FRONTEND_RELEASE_DIR }}"
              rsync -a --delete \
                --exclude ".git" \
                --exclude "node_modules" \
                --exclude ".env.local" \
                "$FRONTEND_DIR/" \
                "${{ secrets.FRONTEND_RELEASE_DIR }}/"

              cd "${{ secrets.FRONTEND_RELEASE_DIR }}"
              npm ci --omit=dev
            fi

            if command -v pm2 >/dev/null 2>&1; then
              pm2 list
              if [ -n "${{ secrets.PM2_BACKEND_APP_NAME }}" ]; then
                pm2 restart "${{ secrets.PM2_BACKEND_APP_NAME }}" --update-env
              else
                echo "PM2_BACKEND_APP_NAME is empty; backend restart skipped."
              fi
              if [ -n "${{ secrets.PM2_FRONTEND_APP_NAME }}" ]; then
                pm2 restart "${{ secrets.PM2_FRONTEND_APP_NAME }}" --update-env
              else
                echo "PM2_FRONTEND_APP_NAME is required to restart the frontend."
                exit 1
              fi
              pm2 save
            else
              echo "pm2 not found. Build completed, restart the app manually."
            fi
