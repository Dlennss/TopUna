name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulsa-be

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: pulsa-be/go.mod
          cache-dependency-path: pulsa-be/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test ./...

  frontend:
    name: Frontend Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulsa-fe
    env:
      NEXT_PUBLIC_SITE_URL: https://topuna.com
      NEXTAUTH_URL: https://topuna.com
      NEXTAUTH_SECRET: ci-only-secret
      NEXT_PUBLIC_API_BASE: http://127.0.0.1:8083
      API_BASE: http://127.0.0.1:8083

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pulsa-fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
